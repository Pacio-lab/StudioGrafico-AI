<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white flex flex-col justify-between overflow-x-hidden">

                <button onclick="appState.navigateTo('profile')" class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white hover:border-slate-700 transition-all">

    <!-- AUTHENTICATION MODAL -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal hidden">

            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-accent-cyan p-0.5 mx-auto mb-3 shadow-glow">
                    <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                        <i class="fa-solid fa-user-shield text-brand-400 text-xl"></i>
                    </div>
                </div>
                <h3 id="authTitle" class="text-lg font-bold text-white">Accedi al tuo Account</h3>
                <p id="authSubtitle" class="text-xs text-slate-400 mt-1">Sincronizza i progetti salvati nel Cloud</p>
            </div>

            <div class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email</label>
                    <input type="email" id="authEmail" placeholder="nome@azienda.it" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                    <input type="password" id="authPassword" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500">
                </div>

                <button onclick="authUI.submit()" id="authSubmitBtn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-600 to-accent-purple text-white font-bold text-xs shadow-glow">
                    Accedi
                </button>

                <div class="flex items-center justify-between text-xs text-slate-400 pt-2">
                    <button onclick="authUI.toggleMode()" id="authSwitchBtn" class="hover:text-brand-400 underline">
                        Registrati nuovo account
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- PROJECT DETAIL MODAL -->
    <div id="projectModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal hidden">
        <div id="projectModalContent" class="w-full max-w-md glass-card bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto"></div>
    </div>

    <script>
        /**
         * Global Toast Helper
         */
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const toast = document.createElement('div');
            
            const bgClass = type === 'error' ? 'bg-rose-950/90 border-rose-800 text-rose-200' :
                            type === 'success' ? 'bg-emerald-950/90 border-emerald-800 text-emerald-200' :
                            'bg-slate-900/90 border-slate-700 text-slate-200';
            
            const icon = type === 'error' ? 'fa-circle-exclamation text-rose-400' :
                         type === 'success' ? 'fa-circle-check text-emerald-400' :
                         'fa-circle-info text-brand-400';

            toast.className = `p-3.5 rounded-2xl border ${bgClass} backdrop-blur-md shadow-xl flex items-center space-x-3 text-xs font-semibold transform transition-all duration-300 translate-y-[-10px] opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base shrink-0"></i><span class="leading-snug">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-[-10px]', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'scale-95');
                setTimeout(() => toast.remove(), 300);
            }, 3800);
        }

        /**
         * Service Worker PWA Setup
         */
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'studiografico-ai-v2';
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', e => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        /**
         * Application State Management
         */
        class AppState {
            constructor() {
                this.currentView = 'home';
                this.selectedModel = 'gemini-2.5-flash-image'; // Default model
                this.selectedWizard = 'logo'; // logo, grafica, modifica, social, volantino, tshirt
                this.generatedProjects = [];
                this.currentGeneratedResult = null;
                this.editingImageBase64 = null;
                this.isGenerating = false;
                this.apiKey = localStorage.getItem('GEMINI_API_KEY') || '';

                // Restore saved projects
                try {
                    const cached = localStorage.getItem('sg_saved_projects');
                    if (cached) this.generatedProjects = JSON.parse(cached);
                } catch(e){}
            }

            init() {
                this.checkApiKeyStatus();
                this.renderView();
            }

            checkApiKeyStatus() {
                const dot = document.getElementById('apiStatusDot');
                const btnText = document.getElementById('apiKeyBtnText');
                if (this.apiKey && this.apiKey.trim().length > 10) {
                    if (dot) { dot.classList.remove('bg-rose-500'); dot.classList.add('bg-emerald-400'); }
                    if (btnText) btnText.textContent = '🔑 Key Attiva';
                } else {
                    if (dot) { dot.classList.remove('bg-emerald-400'); dot.classList.add('bg-rose-500'); }
                    if (btnText) btnText.textContent = '🔑 Inserisci Key';
                }
            }

            openApiKeyModal() {
                const input = document.getElementById('apiKeyInput');
                if (input) input.value = this.apiKey;
                document.getElementById('apiKeyModal').classList.remove('hidden');
            }

            closeApiKeyModal() {
                document.getElementById('apiKeyModal').classList.add('hidden');
            }

            saveApiKey() {
                const val = document.getElementById('apiKeyInput')?.value?.trim();
                if (!val) {
                    showToast('Inserisci una chiave API valida.', 'error');
                    return;
                }
                this.apiKey = val;
                localStorage.setItem('GEMINI_API_KEY', val);
                this.checkApiKeyStatus();
                this.closeApiKeyModal();
                showToast('Chiave API salvata con successo!', 'success');
            }

            setModel(modelKey) {
                this.selectedModel = modelKey;
                const badge = document.getElementById('headerModelBadge');
                if (badge) {
                    badge.textContent = modelKey.includes('imagen') ? 'Imagen 3' : 'Gemini Flash Image';
                }
                showToast(`Modello attivo: ${badge.textContent}`, 'info');
                this.renderView();
            }

            navigateTo(view, wizardType = 'logo') {
                this.currentView = view;
                if (wizardType) this.selectedWizard = wizardType;
                this.updateNavHighlight();
                this.renderView();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            updateNavHighlight() {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('text-brand-500');
                    btn.classList.add('text-slate-400');
                });
                const activeBtn = document.getElementById(`nav-${this.currentView}`);
                if (activeBtn) {
                    activeBtn.classList.remove('text-slate-400');
                    activeBtn.classList.add('text-brand-500');
                }
            }

            saveProject(projectData) {
                this.generatedProjects.unshift(projectData);
                localStorage.setItem('sg_saved_projects', JSON.stringify(this.generatedProjects.slice(0, 40)));
                showToast('Progetto salvato nei tuoi preferiti!', 'success');
            }

            deleteProject(id) {
                this.generatedProjects = this.generatedProjects.filter(p => p.id !== id);
                localStorage.setItem('sg_saved_projects', JSON.stringify(this.generatedProjects));
                showToast('Progetto eliminato', 'info');
                this.renderView();
            }

            renderView() {
                const main = document.getElementById('mainContent');
                if (!main) return;

                switch(this.currentView) {
                    case 'home': main.innerHTML = this.templateHome(); break;
                    case 'wizards': main.innerHTML = this.templateWizards(); break;
                    case 'output': main.innerHTML = this.templateOutput(); break;
                    case 'gallery': main.innerHTML = this.templateGallery(); break;
                    case 'profile': main.innerHTML = this.templateProfile(); break;
                    default: main.innerHTML = this.templateHome();
                }
            }

            templateHome() {
                return `
                    <!-- WELCOME BANNER -->
                    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-brand-900/80 via-slate-900 to-slate-950 p-6 border border-brand-500/30 shadow-glow">
                        <div class="absolute -right-6 -top-6 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl pointer-events-none"></div>
                        <div class="relative z-10">
                            <span class="inline-block px-3 py-1 rounded-full bg-brand-500/20 border border-brand-500/40 text-brand-300 text-[10px] font-bold uppercase tracking-wider mb-2">
                                Studio AI Grafico
                            </span>
                            <h2 class="text-xl font-extrabold text-white tracking-tight">Crea Grafiche e Loghi con l'AI</h2>
                            <p class="text-xs text-slate-300 mt-1 leading-relaxed">Genera o modifica grafiche ad alta definizione trasforma semplici idee in progetti pronti per la stampa e i social.</p>

                            <!-- Engine Selector -->
                            <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between">
                                <span class="text-xs font-bold text-slate-400">Modello AI:</span>
                                <div class="bg-slate-950/80 p-1 rounded-xl border border-slate-800 flex space-x-1">
                                    <button onclick="appState.setModel('gemini-2.5-flash-image')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all ${this.selectedModel === 'gemini-2.5-flash-image' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}">
                                        ⚡ Flash Image
                                    </button>
                                    <button onclick="appState.setModel('imagen-3.0-generate-002')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all ${this.selectedModel.includes('imagen') ? 'bg-accent-purple text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}">
                                        💎 Imagen 3
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 7 CORE WIZARD ACTION CARDS -->
                    <div class="space-y-3">
                        <h3 class="text-xs font-extrabold tracking-wider uppercase text-slate-400 px-1">Scegli la tua creazione</h3>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <!-- 1. CREA LOGO -->
                            <div onclick="appState.navigateTo('wizards', 'logo')" class="glass-card p-4 rounded-2xl border border-slate-800 hover:border-brand-500/50 hover:bg-slate-900/90 transition-all cursor-pointer group flex flex-col justify-between h-36">
                                <div class="flex items-center justify-between">
                                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-brand-600 flex items-center justify-center text-white shadow-glow">
                                        <i class="fa-solid fa-compass-drafting text-lg"></i>
                                    </div>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-600 group-hover:text-brand-400 transition-colors"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-white group-hover:text-brand-300">CREA LOGO</h4>
                                    <p class="text-[11px] text-slate-400 mt-0.5">Brand Identity & Vettoriali</p>
                                </div>
                            </div>

                            <!-- 2. CREA GRAFICA -->
                            <div onclick="appState.navigateTo('wizards', 'grafica')" class="glass-card p-4 rounded-2xl border border-slate-800 hover:border-accent-cyan/50 hover:bg-slate-900/90 transition-all cursor-pointer group flex flex-col justify-between h-36">
                                <div class="flex items-center justify-between">
                                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-glow">
                                        <i class="fa-solid fa-palette text-lg"></i>
                                    </div>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-600 group-hover:text-cyan-400 transition-colors"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-white group-hover:text-cyan-300">CREA GRAFICA</h4>
                                    <p class="text-[11px] text-slate-400 mt-0.5">Banner & Artwork Pubblicitari</p>
                                </div>
                            </div>

                            <!-- 3. MODIFICA IMMAGINE -->
                            <div onclick="appState.navigateTo('wizards', 'modifica')" class="glass-card p-4 rounded-2xl border border-slate-800 hover:border-accent-pink/50 hover:bg-slate-900/90 transition-all cursor-pointer group flex flex-col justify-between h-36">
                                <div class="flex items-center justify-between">
                                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-600 flex items-center justify-center text-white shadow-glow">
                                        <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                                    </div>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-600 group-hover:text-pink-400 transition-colors"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-white group-hover:text-pink-300">MODIFICA FOTO</h4>
                                    <p class="text-[11px] text-slate-400 mt-0.5">Fotoritocco e cambio sfondo</p>
                                </div>
                            </div>

                            <!-- 4. SOCIAL -->
                            <div onclick="appState.navigateTo('wizards', 'social')" class="glass-card p-4 rounded-2xl border border-slate-800 hover:border-purple-500/50 hover:bg-slate-900/90 transition-all cursor-pointer group flex flex-col justify-between h-36">

        class WizardController {
            constructor() {
                this.uploadedImageBase64 = null;
            }

            handleImageUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    this.uploadedImageBase64 = event.target.result;
                    const preview = document.getElementById('uploadPreview');
                    if (preview) {
                        preview.innerHTML = `

                        `;
                    }
                };
                reader.readAsDataURL(file);
            }

            enhancePrompt() {
                const type = appState.selectedWizard;
                let basePrompt = '';

                if (type === 'logo') {
                    const name = document.getElementById('brandName')?.value || 'Brand';
                    const sector = document.getElementById('brandSector')?.value || 'Attività';
                    const style = document.getElementById('logoStyle')?.value || 'Minimalista';
                    const colors = document.getElementById('colorPalette')?.value || 'Moderni';
                    const symbol = document.getElementById('logoSymbol')?.value || 'Icona moderna';

                    basePrompt = `Professional logo design for "${name}", sector: ${sector}. Style: ${style}. Featured symbol: ${symbol}. Color palette: ${colors}. High resolution vector aesthetic, clean geometry, isolated on neutral dark background, ultra crisp graphic design quality.`;
                } else {
                    const title = document.getElementById('graphicTitle')?.value || '';
                    const desc = document.getElementById('graphicDesc')?.value || '';
                    const style = document.getElementById('graphicStyle')?.value || 'Fotorealistico';
                    basePrompt = `Commercial quality graphic visual concept for "${title}". Description details: ${desc}. Style: ${style}. Sharp lighting, artistic composition, vivid colors, modern graphic design studio output.`;
                }

                const promptBox = document.getElementById('enhancedPromptInput');
                if (promptBox) promptBox.value = basePrompt;
                return basePrompt;
            }

            async handleGenerate(e) {
                if (e) e.preventDefault();
                if (appState.isGenerating) return;

                let prompt = document.getElementById('enhancedPromptInput')?.value;
                if (!prompt || prompt.trim().length < 5) prompt = this.enhancePrompt();

                appState.isGenerating = true;
                const genBtn = document.getElementById('generateBtn');
                if (genBtn) {
                    genBtn.disabled = true;
                    genBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-base"></i><span>Elaborazione AI...</span>`;
                }

                try {
                    let imageUrl = '';
                    const apiKey = appState.apiKey || localStorage.getItem('GEMINI_API_KEY');

                    // If API key is missing, prompt modal immediately
                    if (!apiKey) {
                        appState.openApiKeyModal();
                        throw new Error("API Key di Gemini non inserita. Inseriscila per usare il servizio AI cloud!");
                    }

                    showToast('Invio richiesta al server Gemini...', 'info');
                    
                    // Call API with proper API Key in Query Param & Header
                    imageUrl = await this.callGeminiApi(prompt, apiKey);

                    if (imageUrl) {
                        appState.currentGeneratedResult = {
                            id: 'proj_' + Date.now(),
                            title: document.getElementById('brandName')?.value || document.getElementById('graphicTitle')?.value || 'Grafica AI',
                            prompt: prompt,
                            imageUrl: imageUrl,
                            type: appState.selectedWizard,
                            createdAt: Date.now()
                        };
                        showToast('Grafica creata con successo!', 'success');
                        appState.navigateTo('output');
                    }
                } catch (err) {
                    console.warn('API Call Notice:', err);
                    showToast(err.message || 'Errore durante la chiamata API. Generazione Grafica Fallback...', 'error');
                    
                    // FALLBACK ENGINE ACTIVATION
                    setTimeout(() => {
                        const fallbackUrl = this.generateFallbackCanvasGraphic(prompt);
                        appState.currentGeneratedResult = {
                            id: 'proj_' + Date.now(),
                            title: document.getElementById('brandName')?.value || document.getElementById('graphicTitle')?.value || 'Grafica Vettoriale',
                            prompt: prompt + ' (Rendered via Pro Canvas Local Engine)',
                            imageUrl: fallbackUrl,
                            type: appState.selectedWizard,
                            createdAt: Date.now()
                        };
                        showToast('Generata grafica ad alta definizione via Local Engine!', 'info');
                        appState.navigateTo('output');
                    }, 500);
                } finally {
                    appState.isGenerating = false;
                    if (genBtn) {
                        genBtn.disabled = false;
                        genBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles text-base"></i><span>GENERA GRAFICA AI</span>`;
                    }
                }
            }

            async callGeminiApi(promptText, apiKey) {
                const model = appState.selectedModel || 'gemini-2.5-flash-image';
                
                // CRITICAL FIX FOR API KEY ERROR: ALWAYS PASS ?key=${apiKey} AND x-goog-api-key HEADER
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;

                const payload = {
                    contents: [{
                        role: 'user',
                        parts: [{ text: promptText }]
                    }],
                    generationConfig: {
                        responseModalities: ['IMAGE'],
                        imageConfig: { aspectRatio: '1:1' }
                    }
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': apiKey
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errJson = await response.json().catch(() => ({}));
                    throw new Error(errJson.error?.message || `Errore HTTP ${response.status}`);
                }

                const data = await response.json();
                const inlinePart = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

                if (inlinePart && inlinePart.inlineData) {
                    return `data:${inlinePart.inlineData.mimeType};base64,${inlinePart.inlineData.data}`;
                } else {
                    throw new Error("Risposta API senza immagine valida.");
                }
            }

            generateFallbackCanvasGraphic(promptText) {
                const canvas = document.createElement('canvas');
                canvas.width = 1084;
                canvas.height = 1084;
                const ctx = canvas.getContext('2d');

                const title = document.getElementById('brandName')?.value || document.getElementById('graphicTitle')?.value || 'STUDIO GRAFICO AI';
                
                // Background Gradient
                const bgGrad = ctx.createLinearGradient(0, 0, 1084, 1084);
                bgGrad.addColorStop(0, '#0f172a');
                bgGrad.addColorStop(0.5, '#1e1b4b');
                bgGrad.addColorStop(1, '#020617');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, 1084, 1084);

                // Decorative Geometric Art
                ctx.save();
                ctx.strokeStyle = 'rgba(99, 102, 241, 0.25)';
                ctx.lineWidth = 4;
                for(let i=0; i<6; i++) {
                    ctx.beginPath();
                    ctx.arc(542, 542, 120 + (i * 65), 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();

                // Central Badge Shape
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.strokeStyle = '#6366f1';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.roundRect(242, 242, 600, 600, 48);
                ctx.fill();
                ctx.stroke();

                // Center Icon/Emblem
                ctx.font = '90px "Font Awesome 6 Free"';
                ctx.fillStyle = '#38bdf8';
                ctx.textAlign = 'center';
                ctx.fillText('✨', 542, 440);

                // Main Title Text
                ctx.font = 'bold 52px "Plus Jakarta Sans", sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText(title.toUpperCase(), 542, 560);

                // Subtitle
                ctx.font = '24px "Plus Jakarta Sans", sans-serif';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText('PRO GRAPHIC ARTWORK', 542, 620);

                return canvas.toDataURL('image/png');
            }
        }

        class OutputController {
            downloadImage(dataUrl, filename) {
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast('Download avviato!', 'success');
            }
        }

        class GalleryController {
            openModal(id) {
                const p = appState.generatedProjects.find(item => item.id === id);
                if (!p) return;
                const modal = document.getElementById('projectModal');
                const content = document.getElementById('projectModalContent');
                content.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-white truncate">${p.title}</h3>
                            <button onclick="document.getElementById('projectModal').classList.add('hidden')" class="text-slate-400 hover:text-white">
                                <i class="fa-solid fa-xmark text-base"></i>
                            </button>
                        </div>
                        <img src="${p.imageUrl}" class="w-full h-auto rounded-2xl bg-slate-950 border border-slate-800">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="outputController.downloadImage('${p.imageUrl}', 'grafica.png')" class="py-2.5 rounded-xl bg-brand-600 text-white font-bold text-xs">Scarica</button>
                            <button onclick="appState.deleteProject('${p.id}'); document.getElementById('projectModal').classList.add('hidden');" class="py-2.5 rounded-xl bg-rose-950 border border-rose-800 text-rose-300 font-bold text-xs">Elimina</button>
                        </div>
                    </div>
                `;
                modal.classList.remove('hidden');
            }
        }

        class AuthUI {
            closeModal() { document.getElementById('authModal').classList.add('hidden'); }
            toggleMode() { showToast('Modalità autenticazione aggiornata', 'info'); }
            submit() { showToast('Accesso effettuato!', 'success'); this.closeModal(); }
        }

        window.appState = new AppState();
        window.wizardController = new WizardController();
        window.outputController = new OutputController();
        window.galleryController = new GalleryController();
        window.authUI = new AuthUI();

        window.onload = () => {
            window.appState.init();
        };
    </script>
</body>
</html>
