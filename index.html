<!DOCTYPE html>
<html lang="it" class="dark h-full bg-slate-950">
<head>

    <meta name="apple-mobile-web-app-capable" content="yes">

                        }

                    boxShadow: {

        }
    </script>
    
    <style>

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

            background: rgba(15, 23, 42, 0.6);

            background: rgba(15, 23, 42, 0.85);

</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white flex flex-col justify-between overflow-x-hidden">

    <!-- MAIN CONTAINER (Centered desktop preview, edge-to-edge on mobile) -->
    <div id="app" class="relative max-w-md sm:max-w-xl mx-auto w-full min-h-screen flex flex-col bg-slate-950 shadow-2xl pb-24 pt-safe">

        <!-- TOP BAR / HEADER -->
        <header class="sticky top-0 z-30 px-4 py-3 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="appState.navigateTo('home')">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 via-accent-purple to-accent-cyan p-0.5 shadow-glow">
                    <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                        <i class="fa-solid font-bold fa-wand-magic-sparkles text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-accent-cyan text-lg"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
                        StudioGrafico <span class="text-brand-500">AI</span>
                    </h1>
                    <p class="text-[10px] text-slate-400 font-medium tracking-wide flex items-center gap-1">
                        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span id="headerModelBadge">Gemini 3.1 Flash Image</span>
                    </p>
                </div>
            </div>

            <!-- Quick Action Buttons Header -->
            <div class="flex items-center space-x-2">
                <button id="pwaInstallBtn" onclick="appState.installPWA()" class="hidden text-xs bg-slate-800 hover:bg-slate-700 text-brand-500 font-semibold px-2.5 py-1.5 rounded-xl border border-brand-500/30 flex items-center gap-1.5 transition-all">
                    <i class="fa-solid fa-download"></i>
                    <span>Installa</span>
                </button>
                <button onclick="appState.navigateTo('profile')" class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white hover:border-slate-700 transition-all">
                    <i class="fa-regular fa-user"></i>
                </button>
            </div>
        </header>

        <!-- MAIN VIEW PORT (Dynamic Screens Container) -->
        <main id="mainContent" class="flex-1 px-4 py-4 overflow-y-auto space-y-6">
            <!-- Dynamic Content injected by JS -->
        </main>

        <!-- MOBILE BOTTOM NAVIGATION BAR -->
        <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/90 backdrop-blur-md border-t border-slate-800/80 px-4 py-2 pb-safe">
            <div class="max-w-md sm:max-w-xl mx-auto flex items-center justify-around">
                <button onclick="appState.navigateTo('home')" id="nav-home" class="nav-btn flex flex-col items-center py-1 px-3 text-brand-500 transition-all">
                    <i class="fa-solid fa-compass text-lg mb-1"></i>
                    <span class="text-[10px] font-semibold">Home</span>
                </button>
                <button onclick="appState.navigateTo('wizards')" id="nav-wizards" class="nav-btn flex flex-col items-center py-1 px-3 text-slate-400 hover:text-slate-200 transition-all">
                    <i class="fa-solid fa-pen-ruler text-lg mb-1"></i>
                    <span class="text-[10px] font-semibold">Crea</span>
                </button>
                <button onclick="appState.navigateTo('gallery')" id="nav-gallery" class="nav-btn flex flex-col items-center py-1 px-3 text-slate-400 hover:text-slate-200 transition-all">
                    <i class="fa-solid fa-images text-lg mb-1"></i>
                    <span class="text-[10px] font-semibold">Progetti</span>
                </button>
                <button onclick="appState.navigateTo('profile')" id="nav-profile" class="nav-btn flex flex-col items-center py-1 px-3 text-slate-400 hover:text-slate-200 transition-all">
                    <i class="fa-solid fa-user-gear text-lg mb-1"></i>
                    <span class="text-[10px] font-semibold">Profilo</span>
                </button>
            </div>
        </nav>

    </div>

    <!-- GLOBAL TOAST NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-xs space-y-2 pointer-events-none"></div>

    <!-- AUTH MODAL CONTAINER -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal hidden">
        <div class="w-full max-w-sm glass-card bg-slate-900/95 border border-slate-800 rounded-3xl p-6 shadow-2xl relative">
            <button onclick="authUI.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-accent-cyan p-0.5 mx-auto mb-3 shadow-glow">
                    <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
                        <i class="fa-solid fa-lock text-brand-400 text-xl"></i>
                    </div>
                </div>
                <h3 id="authTitle" class="text-xl font-bold text-white">Accedi a StudioGrafico AI</h3>
                <p id="authSubtitle" class="text-xs text-slate-400 mt-1">Salva i tuoi progetti e sincronizza le tue creazioni</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email</label>
                    <input type="email" id="authEmail" placeholder="nome@esempio.it" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                    <input type="password" id="authPassword" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>

                <div id="authRegisterExtra" class="hidden">
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Conferma Password</label>
                    <input type="password" id="authPasswordConfirm" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>

                <button id="authSubmitBtn" onclick="authUI.submit()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-600 to-accent-purple text-white font-bold text-sm shadow-glow hover:opacity-95 transition-all">
                    Accedi
                </button>

                <div class="flex items-center justify-between text-xs text-slate-400 pt-2">
                    <button onclick="authUI.toggleMode()" id="authSwitchBtn" class="hover:text-brand-400 underline">
                        Non hai un account? Registrati
                    </button>
                    <button onclick="authUI.forgotPassword()" class="hover:text-brand-400">
                        Password dimenticata?
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- PROJECT DETAIL MODAL -->
    <div id="projectModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 glass-modal hidden">
        <div id="projectModalContent" class="w-full max-w-md glass-card bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <!-- Dynamic Modal Content -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken,
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            sendPasswordResetEmail, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            getDocs, 
            deleteDoc, 
            query 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase state & configs
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'studiografico-ai-pwa';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-key",
            authDomain: "demo.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:demo"
        };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch(e) {
            console.warn("Firebase initialization notice:", e);
        }

        window.firebaseCtx = {
            app, auth, db, appId,
            currentUser: null,
            isAuthReady: false
        };

        // Firebase Auth State Observer
        if (auth) {
            // Attempt Custom Token or Anonymous fallback if needed
            (async () => {
                try {
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else if (!auth.currentUser) {
                        await signInAnonymously(auth);
                    }
                } catch (err) {
                    console.log("Auth init token notice:", err);
                    try { if(!auth.currentUser) await signInAnonymously(auth); } catch(e){}
                }
            })();

            onAuthStateChanged(auth, (user) => {
                window.firebaseCtx.currentUser = user;
                window.firebaseCtx.isAuthReady = true;
                if (window.appState) {
                    window.appState.onUserChanged(user);
                }
            });
        }
    </script>

    <script>
        /**
         * Global Toast Helper
         */
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgClass = type === 'error' ? 'bg-rose-950/90 border-rose-800 text-rose-200' :
                            type === 'success' ? 'bg-emerald-950/90 border-emerald-800 text-emerald-200' :
                            'bg-slate-900/90 border-slate-700 text-slate-200';
            
            const icon = type === 'error' ? 'fa-circle-exclamation text-rose-400' :
                         type === 'success' ? 'fa-circle-check text-emerald-400' :
                         'fa-circle-info text-brand-400';

            toast.className = `p-3.5 rounded-2xl border ${bgClass} backdrop-blur-md shadow-xl flex items-center space-x-3 text-xs font-semibold transform transition-all duration-300 translate-y-[-10px] opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            
            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-y-[-10px]', 'opacity-0');
            }, 10);

            // Animate out
            setTimeout(() => {
                toast.classList.add('opacity-0', 'scale-95');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        /**
         * PWA Service Worker Registration dynamically via Blob
         */
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'studiografico-v1';
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', e => {
                    // Simple passthrough strategy for API stability
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW setup note:', err));
        }

        // PWA Install Deferred Prompt listener
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('pwaInstallBtn');
            if (btn) btn.classList.remove('hidden');
        });

        class AppState {
            constructor() {
                this.currentView = 'home';
                this.selectedModel = 'gemini-3.1-flash-image'; // Default model
                this.selectedWizard = 'logo'; // logo, grafica, modifica, social, volantino, tshirt
                this.generatedProjects = [];
                this.currentGeneratedResult = null;
                this.editingImageBase64 = null;
                this.isGenerating = false;

                // Load saved offline local cache if present
                const cached = localStorage.getItem('sg_saved_projects');
                if (cached) {
                    try { this.generatedProjects = JSON.parse(cached); } catch(e){}
                }
            }

            init() {
                this.renderView();
            }

            onUserChanged(user) {
                this.updateProfileBadge();
                if (user && !user.isAnonymous) {
                    this.loadProjectsFromFirestore();
                }
            }

            setModel(modelKey) {
                this.selectedModel = modelKey;
                const badge = document.getElementById('headerModelBadge');
                if (badge) {
                    badge.textContent = modelKey.includes('pro') ? 'Gemini Pro Image' : 'Gemini 3.1 Flash Image';
                }
                showToast(`Modello attivo: ${badge.textContent}`, 'info');
                this.renderView();
            }

            navigateTo(view, wizardType = 'logo') {
                this.currentView = view;
                if (wizardType) this.selectedWizard = wizardType;
                this.updateNavHighlight();
                this.renderView();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            updateNavHighlight() {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('text-brand-500');
                    btn.classList.add('text-slate-400');
                });
                const activeBtn = document.getElementById(`nav-${this.currentView}`);
                if (activeBtn) {
                    activeBtn.classList.remove('text-slate-400');
                    activeBtn.classList.add('text-brand-500');
                }
            }

            updateProfileBadge() {
                const user = window.firebaseCtx?.currentUser;
                const isAnon = !user || user.isAnonymous;
                const btn = document.getElementById('profileStatusBadge');
                if (btn) {
                    btn.textContent = isAnon ? 'Ospite / Non Autenticato' : user.email;
                }
            }

            async installPWA() {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        showToast('Applicazione installata con successo!', 'success');
                        document.getElementById('pwaInstallBtn').classList.add('hidden');
                    }
                    deferredPrompt = null;
                } else {
                    showToast('Per installare su iOS: tocca "Condividi" e poi "Aggiungi a Home"', 'info');
                }
            }

            // Save project to Firestore and Local Storage
            async saveProject(projectData) {
                const user = window.firebaseCtx?.currentUser;
                const appId = window.firebaseCtx?.appId || 'studiografico-ai';
                
                // Add to local state
                this.generatedProjects.unshift(projectData);
                localStorage.setItem('sg_saved_projects', JSON.stringify(this.generatedProjects.slice(0, 30)));

                if (user && window.firebaseCtx?.db) {
                    try {
                        const { doc, setDoc, collection } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        // Rule 1 strictly followed: /artifacts/{appId}/users/{userId}/projects
                        const projectRef = doc(collection(window.firebaseCtx.db, 'artifacts', appId, 'users', user.uid, 'projects'), projectData.id);
                        await setDoc(projectRef, projectData);
                        showToast('Progetto salvato nel cloud!', 'success');
                    } catch(err) {
                        console.error('Firestore save error:', err);
                        showToast('Progetto salvato in locale.', 'info');
                    }
                } else {
                    showToast('Progetto salvato in locale.', 'info');
                }
            }

            // Load saved projects from Firestore
            async loadProjectsFromFirestore() {
                const user = window.firebaseCtx?.currentUser;
                const appId = window.firebaseCtx?.appId;
                if (!user || user.isAnonymous || !window.firebaseCtx?.db) return;

                try {
                    const { getDocs, collection } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                    // Rule 1: /artifacts/{appId}/users/{userId}/projects
                    const colRef = collection(window.firebaseCtx.db, 'artifacts', appId, 'users', user.uid, 'projects');
                    const snapshot = await getDocs(colRef);
                    const cloudProjects = [];
                    snapshot.forEach(d => cloudProjects.push(d.data()));
                    
                    if (cloudProjects.length > 0) {
                        // Merge with local
                        this.generatedProjects = cloudProjects.sort((a,b) => b.createdAt - a.createdAt);
                        localStorage.setItem('sg_saved_projects', JSON.stringify(this.generatedProjects.slice(0, 30)));
                        if (this.currentView === 'gallery') this.renderView();
                    }
                } catch(e) {
                    console.error('Cloud load notice:', e);
                }
            }

            // Delete project
            async deleteProject(id) {
                this.generatedProjects = this.generatedProjects.filter(p => p.id !== id);
                localStorage.setItem('sg_saved_projects', JSON.stringify(this.generatedProjects));
                
                const user = window.firebaseCtx?.currentUser;
                const appId = window.firebaseCtx?.appId;
                if (user && !user.isAnonymous && window.firebaseCtx?.db) {
                    try {
                        const { deleteDoc, doc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await deleteDoc(doc(window.firebaseCtx.db, 'artifacts', appId, 'users', user.uid, 'projects', id));
                    } catch(e){}
                }
                showToast('Progetto eliminato', 'info');
                this.renderView();
            }

            renderView() {
                const main = document.getElementById('mainContent');
                if (!main) return;

                switch(this.currentView) {
                    case 'home':
                        main.innerHTML = this.templateHome();
                        break;
                    case 'wizards':
                        main.innerHTML = this.templateWizards();
                        break;
                    case 'output':
                        main.innerHTML = this.templateOutput();
                        break;
                    case 'gallery':
                        main.innerHTML = this.templateGallery();
                        break;
                    case 'profile':
                        main.innerHTML = this.templateProfile();
                        break;
                    default:
                        main.innerHTML = this.templateHome();
                }
            }

            templateHome() {
                const user = window.firebaseCtx?.currentUser;
                const nameDisplay = user && !user.isAnonymous && user.email ? user.email.split('@')[0] : 'Creatore';

                return `
                    <!-- WELCOME BANNER -->
                    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-brand-900/60 via-slate-900 to-slate-950 p-6 border border-brand-500/20 shadow-glow">
                        <div class="absolute -right-6 -top-6 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl pointer-events-none"></div>
                        <div class="relative z-10">
                            <span class="inline-block px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/30 text-brand-400 text-[10px] font-bold uppercase tracking-wider mb-2">
                                Studio AI Professionale
                            </span>
                            <h2 class="text-2xl font-extrabold text-white tracking-tight">Ciao, ${nameDisplay} 👋</h2>
                            <p class="text-xs text-slate-300 mt-1 leading-relaxed">Cosa vuoi progettare oggi per il tuo brand o social media?</p>

                            <!-- Model Toggle Switch -->
                            <div class="mt-4 pt-4 border-t border-slate-800/80 flex items-center justify-between">
                                <span class="text-xs font-semibold text-slate-400">Motore Grafico AI:</span>
                                <div class="bg-slate-950/80 p-1 rounded-xl border border-slate-800 flex space-x-1">
                                    <button onclick="appState.setModel('gemini-3.1-flash-image')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all ${this.selectedModel === 'gemini-3.1-flash-image' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}">
                                        ⚡ Flash
                                    </button>
                                    <button onclick="appState.setModel('gemini-3.1-flash-image-pro')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all ${this.selectedModel.includes('pro') ? 'bg-accent-purple text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}">
                                        💎 Pro
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 7 CORE ACTION CARDS -->
                    <div class="space-y-3">
                        <h3 class="text-xs font-extrabold tracking-wider uppercase text-slate-400 px-1">Seleziona Strumento</h3>

            templateProfile() {
                const user = window.firebaseCtx?.currentUser;
                const isAuth = user && !user.isAnonymous;

                return `
                    <div class="space-y-5">
                        <h2 class="text-lg font-extrabold text-white">Area Personale</h2>

                        <div class="glass-card p-5 rounded-3xl border border-slate-800 flex items-center space-x-4">
                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-accent-purple flex items-center justify-center text-white text-xl shadow-glow">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-bold text-white">${isAuth ? user.email : 'Utente Ospite'}</h3>
                                <p id="profileStatusBadge" class="text-xs text-slate-400 mt-0.5">${isAuth ? 'Account Registrato' : 'Accedi per salvare nel Cloud'}</p>
                            </div>
                        </div>

                        ${!isAuth ? `
                            <button onclick="authUI.openModal()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-brand-600 to-accent-purple text-white font-bold text-xs shadow-glow">
                                Accedi o Registrati
                            </button>
                        ` : `
                            <button onclick="authUI.logout()" class="w-full py-3.5 rounded-2xl bg-slate-900 border border-slate-800 text-rose-400 font-bold text-xs hover:bg-slate-800">
                                Disconnetti
                            </button>
                        `}

                        <!-- PWA INSTALLATION STATUS & INFO -->
                        <div class="bg-slate-900/80 p-5 rounded-3xl border border-slate-800 space-y-3">
                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">PWA & Applicazione</h4>
                            <p class="text-xs text-slate-300 leading-relaxed">Installa StudioGrafico AI direttamente sulla tua schermata home per un'esperienza nativa senza barra del browser.</p>
                            <button onclick="appState.installPWA()" class="w-full py-3 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 font-semibold text-xs flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-mobile-screen"></i>
                                <span>Aggiungi a Schermata Home</span>
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        class WizardController {
            constructor() {
                this.uploadedImageBase64 = null;
            }

            handleImageUpload(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    this.uploadedImageBase64 = event.target.result;
                    const previewBox = document.getElementById('uploadPreview');
                    if (previewBox) {
                        previewBox.innerHTML = `
                            <img src="${this.uploadedImageBase64}" class="h-24 object-contain rounded-xl border border-slate-700">
                            <p class="text-[10px] text-emerald-400 font-bold">Immagine caricata!</p>
                        `;
                    }
                };
                reader.readAsDataURL(file);
            }

            setEditPreset(instructionText) {
                const input = document.getElementById('editInstruction');
                if (input) input.value = instructionText;
                showToast('Istruzione applicata!', 'info');
            }

            // SMART PROMPT TRANSFORMER (Expands brief text into rich graphic prompts)
            enhancePrompt() {
                const type = appState.selectedWizard;
                let basePrompt = '';

                if (type === 'logo') {
                    const name = document.getElementById('brandName')?.value || 'Brand';
                    const sector = document.getElementById('brandSector')?.value || 'Attività';
                    const style = document.getElementById('logoStyle')?.value || 'Minimalista';
                    const colors = document.getElementById('colorPalette')?.value || 'Moderni';
                    const symbol = document.getElementById('logoSymbol')?.value || 'Icona moderna';
                    const isolated = document.getElementById('isolatedBg')?.checked;

                    basePrompt = `Professional logo design for "${name}", industry: ${sector}. Style: ${style}. Symbol/element: ${symbol}. Color palette: ${colors}. ${isolated ? 'Isolated on plain clean white background, vector style, flat graphic, clean lines, high legibility, graphic design studio quality.' : 'Clean graphic composition.'}`;
                } else if (type === 'modifica') {
                    const instruction = document.getElementById('editInstruction')?.value || 'Migliora la qualità visiva';
                    basePrompt = `Modify the input image according to these precise instructions: ${instruction}. Maintain original core structure and recognizable subject identity while improving composition, lighting, and visual fidelity.`;
                } else {
                    const title = document.getElementById('graphicTitle')?.value || '';
                    const desc = document.getElementById('graphicDesc')?.value || '';
                    const style = document.getElementById('graphicStyle')?.value || 'Fotorealistico';
                    basePrompt = `High quality commercial graphic visual. Title text concept: "${title}". Content description: ${desc}. Visual style: ${style}. Vibrant colors, balanced composition, typography harmony, sharp focus, trend-setting graphic art.`;
                }

                const promptBox = document.getElementById('enhancedPromptInput');
                if (promptBox) {
                    promptBox.value = basePrompt;
                }
                return basePrompt;
            }

            async handleGenerate(e, isRetry = false) {
                if (e) e.preventDefault();

                if (appState.isGenerating) return;

                let finalPrompt = document.getElementById('enhancedPromptInput')?.value;
                if (!finalPrompt || isRetry) {
                    finalPrompt = this.enhancePrompt();
                }

                if (!finalPrompt || finalPrompt.trim().length < 5) {
                    showToast('Inserisci dettagli validi per generare la grafica.', 'error');
                    return;
                }

                appState.isGenerating = true;
                const genBtn = document.getElementById('generateBtn');
                if (genBtn) {
                    genBtn.disabled = true;
                    genBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-base"></i><span>Generazione AI in corso...</span>`;
                }

                try {
                    showToast('Invio richiesta al modello Gemini...', 'info');

                    let generatedImageUrl = '';

                    // Check if image-to-image modification or standard text-to-image
                    if (appState.selectedWizard === 'modifica' && this.uploadedImageBase64) {
                        generatedImageUrl = await this.callGeminiImageToImage(finalPrompt, this.uploadedImageBase64);
                    } else {
                        const aspect = document.getElementById('graphicAspect')?.value || '1:1';
                        generatedImageUrl = await this.callGeminiTextToImage(finalPrompt, aspect);
                    }

                    if (generatedImageUrl) {
                        appState.currentGeneratedResult = {
                            id: 'proj_' + Date.now(),
                            title: document.getElementById('brandName')?.value || document.getElementById('graphicTitle')?.value || 'Grafica Studio AI',
                            prompt: finalPrompt,
                            imageUrl: generatedImageUrl,
                            type: appState.selectedWizard,
                            createdAt: Date.now()
                        };

                        showToast('Grafica creata con successo!', 'success');
                        appState.navigateTo('output');
                    } else {
                        throw new Error("Generazione fallita. Riprova.");
                    }

                } catch (err) {
                    console.error('Gemini API Generation Error:', err);
                    showToast(err.message || 'Errore durante la generazione.', 'error');
                } finally {
                    appState.isGenerating = false;
                    if (genBtn) {
                        genBtn.disabled = false;
                        genBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles text-base"></i><span>GENERA GRAFICA AI</span>`;
                    }
                }
            }

            async callGeminiTextToImage(prompt, aspectRatio = '1:1') {
                const apiKey = ""; // Built-in empty key string provided automatically by environment at runtime
                const model = appState.selectedModel || 'gemini-3.1-flash-image';
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{
                        role: 'user',
                        parts: [{ text: prompt }]
                    }],
                    generationConfig: {
                        responseModalities: ['IMAGE'],
                        imageConfig: { aspectRatio: aspectRatio }
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `Errore HTTP ${response.status}`);
                }

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

                if (part && part.inlineData) {
                    return `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                } else {
                    throw new Error("Il modello non ha restituito dati immagine validi.");
                }
            }

            async callGeminiImageToImage(prompt, base64DataWithPrefix) {
                const apiKey = "";
                const model = appState.selectedModel || 'gemini-3.1-flash-image';
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

                const cleanBase64 = base64DataWithPrefix.split(',')[1] || base64DataWithPrefix;
                const mimeType = base64DataWithPrefix.substring(base64DataWithPrefix.indexOf(":") + 1, base64DataWithPrefix.indexOf(";")) || "image/png";

                const payload = {
                    contents: [{
                        role: 'user',
                        parts: [
                            { text: prompt },
                            {
                                inlineData: {
                                    mimeType: mimeType,
                                    data: cleanBase64
                                }
                            }
                        ]
                    }],
                    generationConfig: {
                        responseModalities: ['IMAGE']
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `Errore HTTP ${response.status}`);
                }

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

                if (part && part.inlineData) {
                    return `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                } else {
                    throw new Error("Modifica immagine fallita.");
                }
            }
        }

        // Output and Gallery controllers
        class OutputController {
            downloadImage(dataUrl, filename) {
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast('Download avviato!', 'success');
            }

            sendToEdit(imageUrl) {
                wizardController.uploadedImageBase64 = imageUrl;
                appState.navigateTo('wizards', 'modifica');
                showToast('Immagine caricata nell\'editor di modifica', 'info');
            }
        }

        class GalleryController {
            openModal(id) {
                const p = appState.generatedProjects.find(item => item.id === id);
                if (!p) return;

                const modal = document.getElementById('projectModal');
                const modalContent = document.getElementById('projectModalContent');

                modalContent.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-white truncate">${p.title}</h3>
                            <button onclick="document.getElementById('projectModal').classList.add('hidden')" class="text-slate-400 hover:text-white">
                                <i class="fa-solid fa-xmark text-base"></i>
                            </button>
                        </div>
                        <img src="${p.imageUrl}" class="w-full h-auto rounded-2xl bg-slate-950 border border-slate-800">
                        <p class="text-xs text-slate-300 font-mono leading-relaxed bg-slate-950 p-3 rounded-xl border border-slate-800 max-h-28 overflow-y-auto">${p.prompt}</p>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="outputController.downloadImage('${p.imageUrl}', 'progetto.png')" class="py-2.5 rounded-xl bg-brand-600 text-white font-bold text-xs">
                                Scarica
                            </button>
                            <button onclick="appState.deleteProject('${p.id}'); document.getElementById('projectModal').classList.add('hidden');" class="py-2.5 rounded-xl bg-rose-950 border border-rose-800 text-rose-300 font-bold text-xs">
                                Elimina
                            </button>
                        </div>
                    </div>
                `;

                modal.classList.remove('hidden');
            }
        }

        class AuthUI {
            constructor() {
                this.isRegisterMode = false;
            }

            openModal() {
                document.getElementById('authModal').classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('authModal').classList.add('hidden');
            }

            toggleMode() {
                this.isRegisterMode = !this.isRegisterMode;
                document.getElementById('authTitle').textContent = this.isRegisterMode ? 'Crea un Account' : 'Accedi a StudioGrafico AI';
                document.getElementById('authSubmitBtn').textContent = this.isRegisterMode ? 'Registrati' : 'Accedi';
                document.getElementById('authSwitchBtn').textContent = this.isRegisterMode ? 'Hai già un account? Accedi' : 'Non hai un account? Registrati';
                document.getElementById('authRegisterExtra').classList.toggle('hidden', !this.isRegisterMode);
            }

            async submit() {
                const email = document.getElementById('authEmail').value;
                const pass = document.getElementById('authPassword').value;

                if (!email || !pass) {
                    showToast('Compila tutti i campi richiesti', 'error');
                    return;
                }

                const auth = window.firebaseCtx?.auth;
                if (!auth) return;

                try {
                    if (this.isRegisterMode) {
                        const passConf = document.getElementById('authPasswordConfirm').value;
                        if (pass !== passConf) {
                            showToast('Le password non coincidono', 'error');
                            return;
                        }
                        const { createUserWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        await createUserWithEmailAndPassword(auth, email, pass);
                        showToast('Registrazione completata con successo!', 'success');
                    } else {
                        const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        await signInWithEmailAndPassword(auth, email, pass);
                        showToast('Accesso effettuato!', 'success');
                    }
                    this.closeModal();
                    appState.renderView();
                } catch (err) {
                    showToast(err.message || 'Errore di autenticazione', 'error');
                }
            }

            async forgotPassword() {
                const email = document.getElementById('authEmail').value;
                if (!email) {
                    showToast('Inserisci la tua email prima di richiedere il reset', 'error');
                    return;
                }
                const auth = window.firebaseCtx?.auth;
                if (!auth) return;

                try {
                    const { sendPasswordResetEmail } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                    await sendPasswordResetEmail(auth, email);
                    showToast('Email di recupero password inviata!', 'success');
                } catch(err) {
                    showToast(err.message || 'Errore nell\'invio dell\'email', 'error');
                }
            }

            async logout() {
                const auth = window.firebaseCtx?.auth;
                if (auth) {
                    const { signOut } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                    await signOut(auth);
                    showToast('Disconnesso', 'info');
                    appState.renderView();
                }
            }
        }

        // Initialize controllers globally
        window.appState = new AppState();
        window.wizardController = new WizardController();
        window.outputController = new OutputController();
        window.galleryController = new GalleryController();
        window.authUI = new AuthUI();

        // Boot Application on window load
        window.onload = function() {
            window.appState.init();
        };
    </script>
</body>
</html>
